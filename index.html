    <script>
      // Gracefully prevent benign websocket connection errors from triggering UI error toasts
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && (event.reason || event);
        var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        if (
          typeof msg === 'string' &&
          (msg.indexOf('WebSocket closed without opened') !== -1 ||
           msg.indexOf('[vite] failed to connect to websocket') !== -1)
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) {
            event.stopImmediatePropagation();
          }
        }
      }, true);
    </script>
